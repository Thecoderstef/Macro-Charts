# Every chart in the repo is defined here. To add one, copy a block and change
# the FRED series IDs. Find IDs at https://fred.stlouisfed.org/ or from Python:
#   python -c "from fredmacro.fred import search; print(search('core pce'))"
#
# INDENTATION MATTERS. Each chart starts with two spaces, then a dash.
# Its settings sit at four spaces. Items under `series:` sit at six spaces.

defaults:
  start: "1995-01-01"
  shade_recessions: true

charts:
  - id: cpi_inflation
    title: "US CPI"
    subtitle: "Consumer price index, year-over-year % change"
    ylabel: "% YoY"
    transform: yoy
    zero_line: true
    note: "Core excludes food and energy"
    series:
      - {fred_id: CPIAUCSL, label: "Headline CPI"}
      - {fred_id: CPILFESL, label: "Core CPI"}

  - id: pce_inflation
    title: "US PCE"
    subtitle: "Personal consumption expenditures price index, year-over-year % change"
    ylabel: "% YoY"
    transform: yoy
    zero_line: true
    hline: 2.0
    hline_label: "FOMC 2% target"
    note: "The 2% target is defined on headline PCE, not CPI"
    series:
      - {fred_id: PCEPI, label: "Headline PCE"}
      - {fred_id: PCEPILFE, label: "Core PCE"}

  - id: cpi_momentum
    title: "CPI Momentum"
    subtitle: "Core CPI, year-over-year vs three-month annualised % change"
    ylabel: "%"
    transform: yoy
    start: "2015-01-01"
    zero_line: true
    series:
      - {fred_id: CPILFESL, label: "YoY", transform: yoy}
      - {fred_id: CPILFESL, label: "3m annualised", transform: three_month_annualised}

  - id: labour_market
    title: "US Unemployement Rate"
    subtitle: "Civilian unemployment rate, % of labour force"
    ylabel: "%"
    transform: level
    series:
      - {fred_id: UNRATE, label: "Unemployment rate"}

  - id: policy_vs_inflation
    title: "FED Rate vs Inflation"
    subtitle: "Effective federal funds rate and core PCE inflation, %"
    ylabel: "%"
    start: "2000-01-01"
    transform: level
    series:
      - {fred_id: FEDFUNDS, label: "Fed funds rate", transform: level}
      - {fred_id: PCEPILFE, label: "Core PCE (YoY)", transform: yoy}

  - id: money_supply
    title: "US Money supply growth, nominal and real"
    subtitle: "M2 money stock, year-over-year % change"
    ylabel: "% YoY"
    transform: yoy
    start: "1995-01-01"
    zero_line: true
    note: "M2's definition changed in May 2020 — savings deposits were reclassified, creating a break"
    series:
      - {fred_id: M2SL, label: "M2 (nominal)"}
      - {fred_id: M2REAL, label: "M2 (real)"}

  - id: gdp_growth
    title: "US GDP Growth"
    subtitle: "Real GDP, quarter-on-quarter annualised vs year-over-year % change"
    ylabel: "%"
    start: "2000-01-01"
    zero_line: true
    note: "2020 quarters dominate the vertical scale"
    series:
      - {fred_id: GDPC1, label: "QoQ annualised", transform: qoq_annualised}
      - {fred_id: GDPC1, label: "Year-over-year", transform: yoy}
