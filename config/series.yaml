# ============================================================================
# MACRO DASHBOARD — chart definitions
# ============================================================================
# To add a chart, copy a block and change the FRED series IDs.
# Find IDs at https://fred.stlouisfed.org/ or from Python:
#   python -c "from fredmacro.fred import search; print(search('core pce'))"
#
# INDENTATION MATTERS. Each chart starts with two spaces, then a dash.
# Its settings sit at four spaces. Items under `series:` sit at six spaces.
#
# `section:` groups charts in the README, in order of first appearance.
# Move a block, and the README order moves with it. Delete a block to drop
# the chart — nothing else needs changing.
#
# ORDER LOGIC: the pack runs from what turns first (leading indicators) to
# what confirms last, then from realised data to what markets have priced,
# and finally to conditions and international. A reader going top to bottom
# moves from "what is coming" to "what has happened" to "what is priced".
#
# RECESSION SHADING comes from USREC, the NBER's dating of *US* recessions.
# It is off for the Swiss and euro area charts, and for series whose history
# is too short to contain one.
# ============================================================================

defaults:
  start: "1995-01-01"
  shade_recessions: true

charts:

  # ======================================================================
  # 1. LEADING INDICATORS — the series that turn before the cycle does
  # ======================================================================

  - id: yield_curve
    section: 1. Leading indicators
    title: "US Yield Curve"
    subtitle: "Treasury yield spreads, percentage points"
    ylabel: "pp"
    transform: level
    start: "1990-01-01"
    zero_line: true
    note: "Below zero = inverted. Lags between inversion and recession are long and variable"
    series:
      - {fred_id: T10Y3M, label: "10y minus 3m"}
      - {fred_id: T10Y2Y, label: "10y minus 2y"}

  - id: jobless_claims
    section: 1. Leading indicators
    title: "US Initial Jobless Claims"
    subtitle: "Initial jobless claims, weekly, seasonally adjusted"
    ylabel: "Claims"
    transform: level
    start: "2021-01-01"
    note: "Starts 2021 — the 2020 spike to 6m would flatten everything else"
    series:
      - {fred_id: ICSA, label: "Initial claims"}

  - id: building_permits
    section: 1. Leading indicators
    title: "US Building Permits"
    subtitle: "New private housing units authorised by building permits, thousands, SAAR"
    ylabel: "Thousands"
    transform: level
    start: "1995-01-01"
    series:
      - {fred_id: PERMIT, label: "Building permits"}

  # ======================================================================
  # 2. GROWTH AND ACTIVITY
  # ======================================================================

  - id: gdp_growth
    section: 2. Growth and activity
    title: "US GDP Growth"
    subtitle: "Real GDP, quarter-on-quarter annualised vs year-over-year % change"
    ylabel: "%"
    start: "2000-01-01"
    zero_line: true
    ylim: [-20, 20]
    note: "Axis clipped to +/-20%. The 2020 quarters run off-scale, at roughly -28% and +35%"
    series:
      - {fred_id: GDPC1, label: "QoQ annualised", transform: qoq_annualised}
      - {fred_id: GDPC1, label: "Year-over-year", transform: yoy}

  # ======================================================================
  # 3. LABOUR MARKET
  # ======================================================================

  - id: labour_market
    section: 3. Labour market
    title: "US Unemployment Rate"
    subtitle: "Civilian unemployment rate, % of labour force"
    ylabel: "%"
    transform: level
    series:
      - {fred_id: UNRATE, label: "Unemployment rate"}

  # ======================================================================
  # 4. INFLATION — REALISED
  # ======================================================================

  - id: cpi_inflation
    section: 4. Inflation - realised
    title: "US CPI"
    subtitle: "Consumer price index, year-over-year % change"
    ylabel: "% YoY"
    transform: yoy
    zero_line: true
    note: "Core excludes food and energy"
    series:
      - {fred_id: CPIAUCSL, label: "Headline CPI"}
      - {fred_id: CPILFESL, label: "Core CPI"}

  - id: pce_inflation
    section: 4. Inflation - realised
    title: "US PCE"
    subtitle: "Personal consumption expenditures price index, year-over-year % change"
    ylabel: "% YoY"
    transform: yoy
    zero_line: true
    hline: 2.0
    hline_label: "FOMC 2% target"
    note: "The 2% target is defined on headline PCE, not CPI"
    series:
      - {fred_id: PCEPI, label: "Headline PCE"}
      - {fred_id: PCEPILFE, label: "Core PCE"}

  - id: cpi_momentum
    section: 4. Inflation - realised
    title: "US Core CPI Momentum"
    subtitle: "Core CPI, year-over-year vs three-month annualised % change"
    ylabel: "%"
    transform: yoy
    start: "2015-01-01"
    zero_line: true
    series:
      - {fred_id: CPILFESL, label: "YoY", transform: yoy}
      - {fred_id: CPILFESL, label: "3m annualised", transform: three_month_annualised}

  # ======================================================================
  # 5. INFLATION — EXPECTED (what the market has already priced)
  # ======================================================================

  - id: inflation_expectations
    section: 5. Inflation - expected
    title: "US Inflation Expectations"
    subtitle: "Breakeven inflation rates implied by TIPS, %"
    ylabel: "%"
    transform: level
    start: "2003-01-01"
    hline: 2.0
    hline_label: "FOMC 2% target"
    note: "5y5y forward is the standard check on whether long-run expectations stay anchored"
    series:
      - {fred_id: T10YIE, label: "10y breakeven"}
      - {fred_id: T5YIFR, label: "5y5y forward"}

  - id: expected_vs_realised
    section: 5. Inflation - expected
    title: "US Breakevens vs Realised CPI"
    subtitle: "10-year breakeven inflation vs realised headline CPI, %"
    ylabel: "%"
    start: "2003-01-01"
    zero_line: true
    note: "The gap between what was priced and what arrived is where a view lives"
    series:
      - {fred_id: T10YIE, label: "10y breakeven", transform: level}
      - {fred_id: CPIAUCSL, label: "Realised CPI (YoY)", transform: yoy}

  # ======================================================================
  # 6. RATES AND POLICY
  # ======================================================================

  - id: policy_vs_inflation
    section: 6. Rates and policy
    title: "US Policy Rate vs Core PCE"
    subtitle: "Effective federal funds rate and core PCE inflation, %"
    ylabel: "%"
    start: "2000-01-01"
    transform: level
    series:
      - {fred_id: FEDFUNDS, label: "Fed funds rate", transform: level}
      - {fred_id: PCEPILFE, label: "Core PCE (YoY)", transform: yoy}

  - id: treasury_yields
    section: 6. Rates and policy
    title: "US Treasury Yields"
    subtitle: "Treasury constant maturity yields, %"
    ylabel: "%"
    transform: level
    start: "2000-01-01"
    note: "2y tracks policy expectations, 10y tracks growth and term premium"
    series:
      - {fred_id: DGS10, label: "10-year"}
      - {fred_id: DGS2, label: "2-year"}

  - id: real_yields
    section: 6. Rates and policy
    title: "US Real vs Nominal 10-Year Yield"
    subtitle: "10-year Treasury yield, nominal vs inflation-indexed, %"
    ylabel: "%"
    transform: level
    start: "2003-01-01"
    zero_line: true
    note: "The real yield is the opportunity cost for gold and the discount rate for long-duration equity"
    series:
      - {fred_id: DGS10, label: "Nominal 10y"}
      - {fred_id: DFII10, label: "Real 10y (TIPS)"}

  # ======================================================================
  # 7. FINANCIAL CONDITIONS AND LIQUIDITY
  # ======================================================================

  - id: credit_spreads
    section: 7. Financial conditions
    title: "US Credit Spreads"
    subtitle: "ICE BofA option-adjusted spreads, percentage points"
    ylabel: "pp"
    transform: level
    start: "2023-08-01"
    shade_recessions: false
    note: "ICE BofA licensing limits FRED to a rolling 3-year window from April 2026"
    series:
      - {fred_id: BAMLH0A0HYM2, label: "High yield"}
      - {fred_id: BAMLC0A0CM, label: "Investment grade"}

  - id: dollar
    section: 7. Financial conditions
    title: "US Dollar Index"
    subtitle: "Nominal broad US dollar index, Jan 2006 = 100"
    ylabel: "Index"
    transform: level
    start: "2006-01-01"
    series:
      - {fred_id: DTWEXBGS, label: "Broad dollar"}

  - id: fed_balance_sheet
    section: 7. Financial conditions
    title: "Fed Balance Sheet"
    subtitle: "Total Federal Reserve assets, millions of USD, weekly"
    ylabel: "$m"
    transform: level
    start: "2007-01-01"
    series:
      - {fred_id: WALCL, label: "Fed total assets"}

  - id: reverse_repo
    section: 7. Financial conditions
    title: "Fed Overnight Reverse Repo"
    subtitle: "Overnight reverse repo, Treasury securities sold, billions of USD"
    ylabel: "$bn"
    transform: level
    start: "2014-01-01"
    series:
      - {fred_id: RRPONTSYD, label: "ON RRP"}

  - id: money_supply
    section: 7. Financial conditions
    title: "US Money Supply (M2)"
    subtitle: "M2 money stock, year-over-year % change"
    ylabel: "% YoY"
    transform: yoy
    zero_line: true
    note: "Real M2 is M2 deflated by CPI. M1, not M2, has the May 2020 definitional break"
    series:
      - {fred_id: M2SL, label: "M2 (nominal)"}
      - {fred_id: M2REAL, label: "M2 (real)"}

  # ======================================================================
  # 8. SWITZERLAND
  # ======================================================================

  - id: ch_inflation
    section: 8. Switzerland
    title: "Swiss CPI"
    subtitle: "Harmonised index of consumer prices, year-over-year % change"
    ylabel: "% YoY"
    transform: yoy
    start: "2006-01-01"
    zero_line: true
    shade_recessions: false
    note: "HICP, the EU-comparable measure. The SNB targets the national LIK, which differs slightly"
    series:
      - {fred_id: CP0000CHM086NEST, label: "Swiss HICP"}

  - id: ch_unemployment
    section: 8. Switzerland
    title: "Swiss Unemployment Rate"
    subtitle: "Unemployment rate, 15 and over, % of labour force"
    ylabel: "%"
    transform: level
    start: "2000-01-01"
    shade_recessions: false
    note: "OECD/ILO definition. SECO's registered-unemployed measure runs 1-2pp lower"
    series:
      - {fred_id: LRUNTTTTCHQ156S, label: "Unemployment rate"}

  - id: ch_gdp
    section: 8. Switzerland
    title: "Swiss GDP Growth"
    subtitle: "Real GDP, quarter-on-quarter annualised vs year-over-year % change"
    ylabel: "%"
    start: "2000-01-01"
    zero_line: true
    shade_recessions: false
    series:
      - {fred_id: CLVMNACSCAB1GQCH, label: "QoQ annualised", transform: qoq_annualised}
      - {fred_id: CLVMNACSCAB1GQCH, label: "Year-over-year", transform: yoy}

  - id: chf_usd
    section: 8. Switzerland
    title: "CHF/USD Exchange Rate"
    subtitle: "Swiss francs per US dollar, daily"
    ylabel: "CHF/USD"
    transform: level
    start: "2000-01-01"
    shade_recessions: false
    note: "Falling line = stronger franc. Note the January 2015 cap removal"
    series:
      - {fred_id: DEXSZUS, label: "CHF per USD"}

  # ======================================================================
  # 9. EURO AREA
  # ======================================================================

  - id: ea_inflation
    section: 9. Euro area
    title: "Euro Area CPI"
    subtitle: "Harmonised index of consumer prices, year-over-year % change"
    ylabel: "% YoY"
    transform: yoy
    start: "1997-01-01"
    zero_line: true
    shade_recessions: false
    hline: 2.0
    hline_label: "ECB 2% target"
    note: "Changing composition: EA11 from 1999 through EA20 from 2023"
    series:
      - {fred_id: CP0000EZCCM086NEST, label: "Euro area HICP"}

  - id: ea_unemployment
    section: 9. Euro area
    title: "Euro Area Unemployment Rate"
    subtitle: "Unemployment rate, 15 and over, % of labour force"
    ylabel: "%"
    transform: level
    start: "2000-01-01"
    shade_recessions: false
    series:
      - {fred_id: LRUNTTTTEZQ156S, label: "Unemployment rate"}

  - id: ea_gdp
    section: 9. Euro area
    title: "Euro Area GDP Growth"
    subtitle: "Real GDP, quarter-on-quarter annualised vs year-over-year % change"
    ylabel: "%"
    start: "2000-01-01"
    zero_line: true
    shade_recessions: false
    series:
      - {fred_id: CLV10MNACB1GQSCAEA20Q, label: "QoQ annualised", transform: qoq_annualised}
      - {fred_id: CLV10MNACB1GQSCAEA20Q, label: "Year-over-year", transform: yoy}
